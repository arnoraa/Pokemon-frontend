<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Pokémon</title>
    <link rel="stylesheet" href="style.css">
    <script src="pokemon.js" defer></script>
</head>
<body>
    <h1>Pokemon</h1>
    <label for="type-filter">Vælg en Primary type:</label>
    <select id="type-filter">
        <option value="">Alle typer</option>
        <option value="Fire">Fire</option>
        <option value="Water">Water</option>
        <option value="Rock">Rock</option>
        <option value="Poison">Poison</option>
    </select>

    <label for="attack-filter">Minimum attack:</label>
    <input id="attack-filter" type="number" placeholder="80">
    <button id="filter-knap">Filtrer</button>

<main id="pokemon-liste">
    <div class="pokemon-kort">
        <h2>"pokemon"</h2>
    </div>
</main>
</body>
</html>
